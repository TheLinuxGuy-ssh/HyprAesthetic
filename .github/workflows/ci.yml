name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  checks:
    name: Lint, Test, Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run CI checks
        run: bash scripts/ci/run-checks.sh

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown files
        run: |
          for f in *.md; do
            echo "Checking $f..."
            grep -o '\[.*\]([^)]*\.md)' "$f" | while read -r link; do
              target=$(echo "$link" | sed 's/.*(\(.*\))/\1/')
              if [[ ! -f "$target" ]]; then
                echo "WARNING: Broken link in $f: $target"
              fi
            done
          done

      - name: Check README has key sections
        run: |
          for section in "Features" "Installation" "Usage" "Components" "Creating Themes" "License"; do
            grep -qi "## $section" README.md || grep -qi "# $section" README.md || echo "WARNING: Missing section: $section"
          done
