name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: |
          shellcheck -x scripts/*.sh
          shellcheck -x scripts/lib/*.sh
          shellcheck -x install.sh
          shellcheck -x uninstall.sh
          shellcheck -x hypraesthetic-theme

  test-syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n hypraesthetic-theme
          bash -n scripts/theme-switcher.sh
          bash -n scripts/backup-configs.sh
          bash -n scripts/install-deps.sh
          bash -n scripts/lib/common.sh
          bash -n scripts/lib/template-engine.sh
          bash -n scripts/lib/distro-detect.sh

      - name: Check Python syntax (template engine)
        run: |
          python3 -m py_compile scripts/lib/template-engine.sh 2>&1 | head -20 || true

  test-templates:
    name: Template Rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test theme.toml parsing
        run: |
          python3 -c "
import tomllib
with open('themes/cyberpunk/theme.toml', 'rb') as f:
    data = tomllib.load(f)
print('Theme:', data['name'])
print('Colors:', len(data['colors']))
print('Components:', data['components'])
"

      - name: Test template variable extraction
        run: |
          python3 -c "
import tomllib
with open('themes/cyberpunk/theme.toml', 'rb') as f:
    data = tomllib.load(f)

def flatten(d, prefix=''):
    for k, v in d.items():
        key = f'{prefix}{k}'.replace('-', '_')
        if isinstance(v, dict):
            flatten(v, f'{key}_')
        elif isinstance(v, bool):
            print(f'{key}={str(v).lower()}')
        elif isinstance(v, (int, float)):
            print(f'{key}={v}')
        else:
            print(f'{key}={v}')

flatten(data)
" > /tmp/vars.sh
          wc -l /tmp/vars.sh

      - name: Test Waybar template rendering
        run: |
          python3 -c "
import re, os

with open('/tmp/vars.sh') as f:
    vars_content = f.read()

variables = {}
for line in vars_content.strip().split('\n'):
    if '=' in line:
        key, value = line.split('=', 1)
        variables[key] = value

with open('themes/_template/waybar/colors.css.template') as f:
    template = f.read()

def replace_var(match):
    var_name = match.group(1)
    var_name_underscore = var_name.replace('.', '_')
    value = variables.get(var_name_underscore, match.group(0))
    if value.startswith('\"') and value.endswith('\"'):
        value = value[1:-1]
    elif value.startswith(\"'\") and value.endswith(\"'\") :
        value = value[1:-1]
    return value

rendered = re.sub(r'\{\{([a-zA-Z0-9_.]+)\}\}', replace_var, template)
print(rendered)
assert '@define-color background' in rendered
assert '#0d0d0d' in rendered
print('Waybar template OK')
"

