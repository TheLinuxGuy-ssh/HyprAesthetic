name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck xvfb python3 python3-pip python3-gi gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Run checks
        run: |
          set -euo pipefail
          bash scripts/ci/run-checks.sh
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo