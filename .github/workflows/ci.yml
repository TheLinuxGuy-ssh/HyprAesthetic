  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          test -f LICENSE
          test -f README.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f .gitignore
          test -f install.sh
          test -f uninstall.sh
          test -f hypraesthetic-theme
          test -f scripts/theme-switcher.sh
          test -f scripts/backup-configs.sh
          test -f scripts/install-deps.sh
          test -f scripts/lib/common.sh
          test -f scripts/lib/template-engine.sh
          test -f scripts/lib/distro-detect.sh
          test -d themes/_template/hypr
          test -d themes/_template/waybar
          test -d themes/_template/hyprwave
          test -d themes/_template/eww
          test -d themes/cyberpunk
          test -f themes/cyberpunk/theme.toml
          echo "All required files present"

      - name: Check script permissions
        run: |
          test -x install.sh
          test -x uninstall.sh
          test -x hypraesthetic-theme
          test -x scripts/theme-switcher.sh
          test -x scripts/backup-configs.sh
          test -x scripts/install-deps.sh
          echo "All scripts executable"

      - name: Check theme.toml validity
        run: |
          python3 -c "
import tomllib
for theme in themes/*/theme.toml:
    if theme != 'themes/_template/theme.toml':
        with open(theme, 'rb') as f:
            data = tomllib.load(f)
        assert 'name' in data
        assert 'colors' in data
        assert 'components' in data
        print(f'OK: {data[\"name\"]}')
"

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown files
        run: |
          # Check for broken internal links (basic)
          for f in *.md; do
            echo "Checking $f..."
            grep -o '\[.*\]([^)]*\.md)' "$f" | while read link; do
              target=$(echo "$link" | sed 's/.*(\(.*\))/\1/')
              if [[ ! -f "$target" ]]; then
                echo "WARNING: Broken link in $f: $target"
              fi
            done
          done

      - name: Check README has key sections
        run: |
          for section in "Features" "Installation" "Usage" "Components" "Creating Themes" "License"; do
            grep -qi "## $section" README.md || grep -qi "# $section" README.md || echo "WARNING: Missing section: $section"
          done