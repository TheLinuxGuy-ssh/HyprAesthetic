# Hyprland base configuration template
# This file is rendered from theme.toml color palette

# Monitor
monitor=,preferred,auto,1

# Input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# General
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = {{colors.hyprland.border_active}}
    col.inactive_border = {{colors.hyprland.border_inactive}}
    layout = dwindle
    allow_tearing = false
    no_cursor_warps = false
    resize_on_border = true
    extend_border_grab_area = 20
}

# Decoration
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
    drop_shadow = true
    shadow_range = 10
    shadow_render_power = 3
    col.shadow = {{colors.hyprland.shadow}}
}

# Animations
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Dwindle layout
dwindle {
    pseudotile = yes
    preserve_split = yes
    no_gaps_when_only = false
    smart_gaps = true
    smart_borders = true
}

# Gestures
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = false
    workspace_swipe_min_speed_to_force = 30
}

# Misc
misc {
    disable_hyprland_logo = true
    xwayland = true
    force_default_wallpaper = 0
    vmr_special = false
    enable_swallow = true
    swallow_regex = ^(foot|alacritty|kitty)$
}

# Window rules
windowrule = float, ^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = size 800 600, ^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = center, ^(pavucontrol|blueman-manager|nm-connection-editor)$