schema = 2
name = "a70"
display_name = "A70"
description = "Sleek modern aesthetic"
author = "HyprAesthetic"
version = "1.0.0"
license = "MIT"
min_hypraesthetic = "0.2.0"

[misc]
wallpaper = "a70.png"
quotes = [
  "Keep the line. Keep the speed.",
  "Quiet cockpit. Loud engine.",
  "Night road. No passengers.",
]

[palette]
base00 = "#0b0d10"
base01 = "#14171c"
base02 = "#1d2229"
base03 = "#2a313a"
base04 = "#8b93a0"
base05 = "#c4ccd6"
base06 = "#e4e8ee"
base07 = "#f4f6f8"
base08 = "#ee6666"
base09 = "#f0a202"
base0A = "#f0a202"
base0B = "#5aa469"
base0C = "#3d7ea6"
base0D = "#f0a202"
base0E = "#3d7ea6"
base0F = "#c4ccd6"

[colors.hyprland]
border_active = "{{palette.base0D}}"
border_inactive = "{{palette.base03}}"
shadow = "{{palette.base00}}aa"

[colors.waybar]
background = "{{palette.base00}}"
foreground = "{{palette.base05}}"
surface = "{{palette.base01}}"
surface_hover = "{{palette.base02}}"
border = "{{palette.base03}}"
foreground_muted = "{{palette.base04}}"
primary = "{{palette.base0D}}"
primary_fg = "{{palette.base00}}"
error = "{{palette.base08}}"
error_fg = "{{palette.base00}}"
warning = "{{palette.base0A}}"
warning_fg = "{{palette.base00}}"
success = "{{palette.base0B}}"
success_fg = "{{palette.base00}}"

[colors.eww]
background = "{{palette.base00}}"
foreground = "{{palette.base05}}"
surface = "{{palette.base01}}"
surface_hover = "{{palette.base02}}"
border = "{{palette.base03}}"
foreground_muted = "{{palette.base04}}"
primary = "{{palette.base0D}}"
primary_fg = "{{palette.base00}}"
error = "{{palette.base08}}"
error_fg = "{{palette.base00}}"
warning = "{{palette.base0A}}"
warning_fg = "{{palette.base00}}"
success = "{{palette.base0B}}"
success_fg = "{{palette.base00}}"

[layout]
bar = "waybar"
bar_style = "v2.9e"
launcher = "rofi"
widgets = ["clock", "system", "music", "uptime"]

[hypr]
gaps_in = 4
gaps_out = 8
border_size = 1
rounding = 6

[identity]
font_ui = "Barlow Condensed, Roboto Condensed, JetBrainsMono Nerd Font"
font_clock = "Barlow Condensed, Roboto Condensed, JetBrainsMono Nerd Font"
font_mono = "JetBrainsMono Nerd Font, Roboto Condensed, monospace"
font_quote = "Barlow Condensed, Adwaita Sans"
clock_size = 72
music_radius = 6
cover_size = 48
matrix_chars = "010101$#%&"
matrix_rows = 48
matrix_cols = 1
matrix_density = 3

[defaults]
file_manager = "nautilus"
terminal = "kitty"

[components]
hyprland = true
waybar = true
hyprwave = true
eww = true
rofi = true
kitty = true
gtk = true
dunst = true
nvim = true
