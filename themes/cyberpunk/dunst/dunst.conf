[global]
    monitor = 0
    follow = keyboard
    geometry = "350x50-20+20"
    indicate_hidden = yes
    shrink = no
    transparency = 0
    notification_height = 0
    separator_height = 2
    padding = 12
    horizontal_padding = 16
    frame_width = 2
    frame_color = "#3a3a3a"
    separator_color = frame
    sort = yes
    idle_threshold = 120
    font = JetBrains Mono Nerd Font 11
    line_height = 0
    markup = full
    format = "<b>%s</b>\n%b"
    alignment = left
    show_age_threshold = 60
    word_wrap = yes
    ignore_newline = no
    stack_duplicates = true
    hide_duplicate_count = false
    show_indicators = yes
    icon_position = left
    min_icon_size = 32
    max_icon_size = 64
    icon_path = /usr/share/icons/Papirus-Dark/48x48:/usr/share/icons/Papirus-Dark/24x24:/usr/share/icons/Papirus-Dark/16x16
    sticky_history = yes
    history_length = 20
    browser = /usr/bin/firefox
    always_run_script = true
    title = Dunst
    class = Dunst
    startup_notification = false
    dmenu = /usr/bin/rofi -dmenu -p dunst:
    dmenu_command = /usr/bin/rofi -dmenu -p dunst:

[frame]
    width = 2
    color = "#3a3a3a"

[shortcuts]
    close = ctrl+space
    close_all = ctrl+shift+space
    history = ctrl+grave
    context = ctrl+shift+period

[urgency_low]
    background = "#1a1a1a"
    foreground = "#cccccc"
    timeout = 10
    frame_color = "#3a3a3a"

[urgency_normal]
    background = "#1a1a1a"
    foreground = "#ffffff"
    timeout = 10
    frame_color = "#3a3a3a"

[urgency_critical]
    background = "#1a1a1a"
    foreground = "#ff6b6b"
    timeout = 0
    frame_color = "#ff6b6b"
