schema = 2
name = "cyberpunk"
display_name = "Cyberpunk 2077"
description = "Neon-drenched futuristic aesthetic inspired by Night City"
author = "HyprAesthetic"
version = "1.0.0"
license = "MIT"
min_hypraesthetic = "0.2.0"

[misc]
wallpaper = "batman.gif"
quotes = [
  "Wake the hell up, samurai.",
  "The city never blinks. Neither should you.",
  "Chrome fades. The rain doesn't.",
]

[palette]
base00 = "#0d0d0d"
base01 = "#1a1a1a"
base02 = "#2a2a2a"
base03 = "#3a3a3a"
base04 = "#b8b8b8"
base05 = "#f5f5f5"
base06 = "#ffffff"
base07 = "#ffffff"
base08 = "#ff003c"
base09 = "#ff6a00"
base0A = "#fcee0a"
base0B = "#00ff9f"
base0C = "#00f0ff"
base0D = "#00f0ff"
base0E = "#fcee0a"
base0F = "#ff003c"

[colors.hyprland]
border_active = "{{palette.base0D}}"
border_inactive = "{{palette.base03}}"
shadow = "{{palette.base00}}aa"

[colors.waybar]
background = "{{palette.base00}}"
foreground = "{{palette.base05}}"
surface = "{{palette.base01}}"
surface_hover = "{{palette.base02}}"
border = "{{palette.base03}}"
foreground_muted = "{{palette.base04}}"
primary = "{{palette.base0D}}"
primary_fg = "{{palette.base00}}"
error = "{{palette.base08}}"
error_fg = "{{palette.base00}}"
warning = "{{palette.base0A}}"
warning_fg = "{{palette.base00}}"
success = "{{palette.base0B}}"
success_fg = "{{palette.base00}}"

[colors.eww]
background = "{{palette.base00}}"
foreground = "{{palette.base05}}"
surface = "{{palette.base01}}"
surface_hover = "{{palette.base02}}"
border = "{{palette.base03}}"
foreground_muted = "{{palette.base04}}"
primary = "{{palette.base0D}}"
primary_fg = "{{palette.base00}}"
error = "{{palette.base08}}"
error_fg = "{{palette.base00}}"
warning = "{{palette.base0A}}"
warning_fg = "{{palette.base00}}"
success = "{{palette.base0B}}"
success_fg = "{{palette.base00}}"

[layout]
bar = "waybar"
bar_style = "v5"
launcher = "rofi"
widgets = ["clock", "music", "system", "matrix", "quote"]

[hypr]
gaps_in = 4
gaps_out = 8
border_size = 2
rounding = 0

[identity]
font_ui = "Share Tech Mono, Orbitron, JetBrainsMono Nerd Font"
font_clock = "Share Tech Mono, Orbitron, JetBrainsMono Nerd Font"
font_mono = "Share Tech Mono, JetBrainsMono Nerd Font, monospace"
font_quote = "Share Tech Mono, JetBrainsMono Nerd Font"
clock_size = 72
music_radius = 0
cover_size = 48
matrix_chars = "010101$#%&"
matrix_rows = 48
matrix_cols = 2
matrix_density = 5

[defaults]
file_manager = "nautilus"
terminal = "kitty"

[components]
hyprland = true
waybar = true
hyprwave = true
eww = true
rofi = true
kitty = true
gtk = true
dunst = true
nvim = true
