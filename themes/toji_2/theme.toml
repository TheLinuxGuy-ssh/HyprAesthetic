schema = 2
name = "toji_2"
display_name = "Toji 2"
description = "inspired by Toji Fushiguro"
author = "HyprAesthetic"
version = "1.0.0"
license = "MIT"
min_hypraesthetic = "0.2.0"

[misc]
wallpaper = "toji_red.png"
hw_theme = "octane"
quotes = [
  "A monkey like me doesn't need jujutsu.",
  "Heavenly restriction is enough.",
  "I sold that kid. I still think about it.",
]

[palette]
base00 = "#080808"
base01 = "#121212"
base02 = "#1c1c1c"
base03 = "#2a2a2a"
base04 = "#cccccc"
base05 = "#ffffff"
base06 = "#ffffff"
base07 = "#ffffff"
base08 = "#ff6b6b"
base09 = "#ff9f43"
base0A = "#ffe66d"
base0B = "#69db7c"
base0C = "#5fe4ff"
base0D = "#ff000c"
base0E = "#a29bfe"
base0F = "#ff7675"

[colors.hyprland]
border_active = "{{palette.base0D}}"
border_inactive = "{{palette.base03}}"
shadow = "{{palette.base00}}aa"

[colors.waybar]
background = "{{palette.base00}}"
foreground = "{{palette.base05}}"
surface = "{{palette.base01}}"
surface_hover = "{{palette.base02}}"
border = "{{palette.base03}}"
foreground_muted = "{{palette.base04}}"
primary = "{{palette.base0D}}"
primary_fg = "{{palette.base00}}"
error = "{{palette.base08}}"
error_fg = "{{palette.base00}}"
warning = "{{palette.base0A}}"
warning_fg = "{{palette.base00}}"
success = "{{palette.base0B}}"
success_fg = "{{palette.base00}}"

[colors.eww]
background = "{{palette.base00}}"
foreground = "{{palette.base05}}"
surface = "{{palette.base01}}"
surface_hover = "{{palette.base02}}"
border = "{{palette.base03}}"
foreground_muted = "{{palette.base04}}"
primary = "{{palette.base0D}}"
primary_fg = "{{palette.base00}}"
error = "{{palette.base08}}"
error_fg = "{{palette.base00}}"
warning = "{{palette.base0A}}"
warning_fg = "{{palette.base00}}"
success = "{{palette.base0B}}"
success_fg = "{{palette.base00}}"

[layout]
bar = "waybar"
bar_style = "v2"
launcher = "rofi"
widgets = ["clock", "quote", "music", "system", "matrix"]

[hypr]
gaps_in = 3
gaps_out = 6
border_size = 2
rounding = 0

[identity]
font_ui = "Barlow Condensed, Oswald, Inter, Adwaita Sans"
font_clock = "Barlow Condensed, Oswald, Inter, JetBrainsMono Nerd Font"
font_mono = "JetBrainsMono Nerd Font, Iosevka, monospace"
font_quote = "Inter, Adwaita Sans"
clock_size = 80
music_radius = 0
cover_size = 64
matrix_chars = "/\\|Y"
matrix_rows = 48
matrix_cols = 2
matrix_density = 5

[defaults]
file_manager = "nautilus"
terminal = "kitty"

[components]
hyprland = true
waybar = true
hyprwave = true
eww = true
rofi = true
kitty = true
gtk = true
dunst = true
nvim = true
