schema = 2
name = "spartan"
display_name = "Spartan"
description = "Black type on the crimson field of spartan.png"
author = "HyprAesthetic"
version = "1.0.0"
license = "MIT"
min_hypraesthetic = "0.2.0"

[meta]
skip_contrast_check = true

[misc]
wallpaper = "spartan.png"
quotes = [
  "Finish the fight.",
  "Spartans never die. They just go missing.",
  "Today we settle the score.",
]

# App chrome (kitty, nvim, dunst). Desktop widgets override text to black.
[palette]
base00 = "#140404"
base01 = "#2a0808"
base02 = "#3d0c0c"
base03 = "#5c1414"
base04 = "#c47a7a"
base05 = "#f6ecec"
base06 = "#fff6f6"
base07 = "#ffffff"
base08 = "#ff6b6b"
base09 = "#ff9f43"
base0A = "#ffe08a"
base0B = "#8dffb0"
base0C = "#ffd0d0"
base0D = "#ffb4b4"
base0E = "#ff8f8f"
base0F = "#e23b3b"

[colors.hyprland]
border_active = "#000000"
border_inactive = "#3d0c0c"
shadow = "#00000066"

[colors.waybar]
background = "#b00404"
foreground = "#000000"
surface = "#fff6f6"
surface_hover = "#ffe08a"
border = "#000000"
foreground_muted = "#fff6f6"
primary = "#fff6f6"
primary_fg = "#000000"
error = "#fff6f6"
error_fg = "#000000"
warning = "#fff6f6"
warning_fg = "#000000"
success = "#fff6f6"
success_fg = "#000000"

[colors.eww]
background = "#fff6f6"
foreground = "#000000"
surface = "#ffe08a"
surface_hover = "#b00404"
border = "#000000"
foreground_muted = "#c47a7a"
primary = "#b00404"
primary_fg = "#fff6f6"
error = "#b00404"
error_fg = "#fff6f6"
warning = "#b00404"
warning_fg = "#fff6f6"
success = "#b00404"
success_fg = "#fff6f6"
matrix_color = "#000000"

[layout]
bar = "waybar"
bar_style = "v3"
launcher = "rofi"
widgets = ["clock", "quote", "music", "system", "matrix"]

[hypr]
gaps_in = 6
gaps_out = 12
border_size = 2
rounding = 0

[identity]
font_ui = "Outfit, Nunito, Adwaita Sans"
font_clock = "Outfit, Nunito, Adwaita Sans"
font_mono = "JetBrainsMono Nerd Font, Iosevka, monospace"
font_quote = "Nunito, Outfit, Adwaita Sans"
clock_size = 72
music_radius = 0
cover_size = 64
matrix_chars = "Λv│·"
matrix_rows = 36
matrix_cols = 1
matrix_density = 3
matrix_mode = "crest"
matrix_size = 22
matrix_opacity = "1"

[hyprwave]
edge = "bottom"
margin = 10

[defaults]
file_manager = "nautilus"
terminal = "kitty"

[components]
hyprland = true
waybar = true
hyprwave = true
eww = true
rofi = true
kitty = true
gtk = true
dunst = true
nvim = true
