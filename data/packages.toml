# Distro package catalog for HyprAesthetic.
# Families map os-release IDs to a package manager. Components map to package
# names per family. Empty package lists mean "not packaged; treat as optional".

[families.arch]
ids = ["arch", "manjaro", "endeavouros", "garuda", "cachyos"]
manager = "pacman"

[families.fedora]
ids = ["fedora", "fedora-asahi-remix", "rhel", "centos", "rocky", "alma"]
manager = "dnf"

[families.debian]
ids = ["ubuntu", "debian", "linuxmint", "pop", "kali"]
manager = "apt"

[families.suse]
ids = ["opensuse", "opensuse-tumbleweed", "opensuse-leap", "suse"]
manager = "zypper"

[families.nix]
ids = ["nixos"]
manager = "nix"

[components.hyprland]
id = "hyprland"
required = true
friendly = "Hyprland compositor"
commands = ["Hyprland"]
packages.arch = ["hyprland"]
packages.fedora = ["hyprland"]
packages.debian = ["hyprland"]
packages.suse = ["hyprland"]
packages.nix = ["hyprland"]

