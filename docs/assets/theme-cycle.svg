-7h3v5h-3zM66 -7h3v5h-3zM103 -7h3v5h-3zM26 -7h3v5h-3zM86 -4h3v2h-3zM71 -3h4v1h-4zM48 -3h1v1h-1zM81 -3h1v1h-1zM95 -3h3v1h-3zM41 -3h4v1h-4zM78 -3h1v1h-1zM81 -2h8v1h-8zM121 -2h7v1h-7zM96 -2h2v1h-2zM62 -2h7v1h-7zM33 -2h6v1h-6zM112 -2h6v1h-6zM72 -2h7v1h-7zM103 -2h6v1h-6zM22 -2h6v1h-6zM42 -2h7v1h-7zM16 -7h3v7h-3zM11 -7h3v7h-3zM6 -5h3v5h-3zM1 -5h3v5h-3zM91 -4h3v4h-3zM134 -3h3v3h-3zM23 -1h4v1h-4zM73 -1h5v1h-5zM43 -1h5v1h-5zM82 -1h6v1h-6zM113 -1h4v1h-4zM66 -1h3v1h-3zM96 -1h3v1h-3zM125 -1h3v1h-3zM62 -1h3v1h-3zM104 -1h5v1h-5zM34 -1h5v1h-5zM121 -1h3v5h-3z" fill="#f5f8ff"/></g><g filter="url(#tglow)"><g class="c1"><path transform="translate(64 318) scale(3.5)" d="M54 -14h3v3h-3zM1 -12h3v2h-3zM61 -13h3v5h-3zM13 -9h4v1h-4zM73 -9h4v1h-4zM65 -9h3v1h-3zM46 -9h3v2h-3zM41 -9h3v2h-3zM52 -9h5v2h-5zM61 -8h7v1h-7zM12 -8h6v1h-6zM72 -8h6v1h-6zM6 -12h3v6h-3zM1 -10h4v4h-4zM28 -9h2v3h-2zM20 -9h2v3h-2zM16 -7h3v1h-3zM11 -7h3v1h-3zM71 -7h3v1h-3zM76 -7h3v1h-3zM42 -7h2v2h-2zM46 -7h2v2h-2zM24 -7h2v3h-2zM27 -6h2v2h-2zM21 -6h2v2h-2zM11 -6h8v2h-8zM71 -6h8v2h-8zM42 -5h6v1h-6zM11 -4h3v1h-3zM71 -4h3v1h-3zM21 -4h8v1h-8zM54 -7h3v5h-3zM66 -7h3v5h-3zM61 -7h3v5h-3zM5 -6h4v4h-4zM18 -3h1v1h-1zM21 -3h3v1h-3zM78 -3h1v1h-1zM26 -3h3v1h-3zM11 -3h4v1h-4zM71 -3h4v1h-4zM43 -4h4v3h-4zM12 -2h7v1h-7zM61 -2h7v1h-7zM72 -2h7v1h-7zM1 -6h3v6h-3zM84 -3h3v3h-3zM51 -2h9v2h-9zM22 -2h2v2h-2zM6 -2h3v2h-3zM26 -2h2v2h-2zM73 -1h5v1h-5zM61 -1h3v1h-3zM65 -1h3v1h-3zM44 -1h2v1h-2zM13 -1h5v1h-5z" fill="#f5f8ff" style="fill:currentColor"/></g></g>

