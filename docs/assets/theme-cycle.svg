<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="ttl desc">
  <title id="ttl">One command. Whole desktop. New vibe.</title>
  <desc id="desc">An illustrated desktop. A terminal types "hat switch" and the whole screen changes color, one theme after another.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e2dfd0"/>
      <stop offset=".10" stop-color="#a9c1d9"/>
      <stop offset=".24" stop-color="#2563b8"/>
      <stop offset=".42" stop-color="#0b2d6b"/>
      <stop offset=".62" stop-color="#061436"/>
      <stop offset="1" stop-color="#030611"/>
    </linearGradient>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="5" height="5" fill="#9cc4ff" fill-opacity=".05"/>
      <path d="M0 .5H6M.5 0V6" stroke="#000" stroke-opacity=".32" stroke-width="1"/>
    </pattern>
    <linearGradient id="dropg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1ea0dc"/><stop offset="1" stop-color="#23d4c4"/>
    </linearGradient>
    <filter id="tglow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="wp0" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#cdd7df"/><stop offset="0.16" stop-color="#7fa6d6"/><stop offset="0.38" stop-color="#1f5fc0"/><stop offset="0.66" stop-color="#0a2a66"/><stop offset="1" stop-color="#04102e"/></linearGradient><linearGradient id="wp1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f0d4e4"/><stop offset="0.16" stop-color="#d98ab8"/><stop offset="0.38" stop-color="#a02a74"/><stop offset="0.66" stop-color="#4a1050"/><stop offset="1" stop-color="#1c0720"/></linearGradient><linearGradient id="wp2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#d6efe3"/><stop offset="0.16" stop-color="#7fd1ab"/><stop offset="0.38" stop-color="#18966e"/><stop offset="0.66" stop-color="#0b4a45"/><stop offset="1" stop-color="#04201f"/></linearGradient><linearGradient id="wp3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f3e3c4"/><stop offset="0.16" stop-color="#e0b070"/><stop offset="0.38" stop-color="#b8651d"/><stop offset="0.66" stop-color="#5a2a0c"/><stop offset="1" stop-color="#230f05"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="card"><rect width="1200" height="460" rx="28"/></clipPath>
    <clipPath id="screen"><rect x="650" y="80" width="480" height="296" rx="12"/></clipPath>
  </defs>
  <style>
    svg{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
    .f{fill:currentColor}
    .s{fill:none;stroke:currentColor}

    /* two accent colors that change with every "theme" (16s loop, brand blue is on screen the longest) */
    .c1{color:#29b6ea;animation:cyc1 16s infinite}
    .c2{color:#9fc3ee;animation:cyc2 16s infinite}
    @keyframes cyc1{0%,10%{color:#29b6ea}15%,35%{color:#ff5fa8}40%,60%{color:#3ddc97}65%,85%{color:#ffb454}90%,100%{color:#29b6ea}}
    @keyframes cyc2{0%,10%{color:#9fc3ee}15%,35%{color:#c792ff}40%,60%{color:#c8f169}65%,85%{color:#ff7675}90%,100%{color:#9fc3ee}}

    /* wallpapers cross-fade on top of the blue one */
    .ov1{opacity:0;animation:ov1 16s infinite}
    .ov2{opacity:0;animation:ov2 16s infinite}
    .ov3{opacity:0;animation:ov3 16s infinite}
    @keyframes ov1{0%,10%{opacity:0}15%,35%{opacity:1}40%,100%{opacity:0}}
    @keyframes ov2{0%,35%{opacity:0}40%,60%{opacity:1}65%,100%{opacity:0}}
    @keyframes ov3{0%,60%{opacity:0}65%,85%{opacity:1}90%,100%{opacity:0}}

    /* typing: 4s per command, 1.6s typing, then the desktop repaints */
    .typed{animation:typing 4s infinite}
    @keyframes typing{0%{clip-path:inset(0 100% 0 0);animation-timing-function:steps(18,end)}40%,100%{clip-path:inset(0 0 0 0)}}
    .cur{transform:translateX(162px);animation:curmove 4s infinite}
    @keyframes curmove{0%{transform:translateX(0);animation-timing-function:steps(18,end)}40%,100%{transform:translateX(162px)}}
    .blink{animation:blink 1s steps(1,end) infinite}
    @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
    .o1{opacity:.3;animation:o1 4s infinite}
    .o2{opacity:.3;animation:o2 4s infinite}
    .o3{opacity:.3;animation:o3 4s infinite}
    @keyframes o1{0%,41%{opacity:0}45%,100%{opacity:.3}}
    @keyframes o2{0%,46%{opacity:0}50%,100%{opacity:.3}}
    @keyframes o3{0%,51%{opacity:0}55%,100%{opacity:.3}}

    /* widgets that keep moving */
    .prog{transform-box:fill-box;transform-origin:0 50%;animation:prog 8s linear infinite}
    @keyframes prog{0%{transform:scaleX(.06)}100%{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.2s ease-in-out infinite alternate}
    .e2{animation-duration:.9s;animation-delay:-.3s}
    .e3{animation-duration:1.4s;animation-delay:-.6s}
    .e4{animation-duration:1s;animation-delay:-.2s}
    .e5{animation-duration:1.1s;animation-delay:-.8s}
    @keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
    .br{transform-box:fill-box;transform-origin:0 50%;animation:br 3.2s ease-in-out infinite alternate}
    .b2{animation-delay:-1s}
    .b3{animation-delay:-2s}
    @keyframes br{0%{transform:scaleX(.9)}100%{transform:scaleX(1)}}
    .spark{stroke-dasharray:100;stroke-dashoffset:0;animation:spark 6s ease-in-out infinite}
    @keyframes spark{0%{stroke-dashoffset:100}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  <g clip-path="url(#card)"><rect width="1200" height="460" fill="url(#sky)"/><rect width="1200" height="460" fill="#02040c" fill-opacity="0.1"/><rect width="1200" height="460" fill="url(#grid)"/></g>
