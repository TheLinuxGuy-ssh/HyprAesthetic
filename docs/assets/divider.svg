<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14" aria-hidden="true" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2dfd0"/>
      <stop offset=".18" stop-color="#a9c1d9"/>
      <stop offset=".40" stop-color="#2563b8"/>
      <stop offset=".70" stop-color="#0b2d6b"/>
      <stop offset="1" stop-color="#061436"/>
    </linearGradient>
    <pattern id="cells" width="8" height="14" patternUnits="userSpaceOnUse"><rect x="1" y="4" width="6" height="6" fill="#ffffff"/></pattern>
    <mask id="m"><rect width="1200" height="14" fill="url(#cells)"/></mask>
  </defs>
  <style>
    .sweep{animation:sweep 7s steps(160) infinite}
    @keyframes sweep{from{transform:translateX(-40px)}to{transform:translateX(1240px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="14" rx="7" fill="#040b20"/>
  <g mask="url(#m)"><rect width="1200" height="14" fill="url(#g)"/></g>
  <g class="sweep">
    <rect x="1" y="4" width="6" height="6" fill="#29b6ea" opacity=".25"/>
    <rect x="9" y="4" width="6" height="6" fill="#29b6ea" opacity=".5"/>
    <rect x="17" y="4" width="6" height="6" fill="#29b6ea" opacity=".8"/>
    <rect x="25" y="4" width="6" height="6" fill="#7fe3ff"/>
  </g>
</svg>
