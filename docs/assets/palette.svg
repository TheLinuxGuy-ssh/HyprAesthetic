<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 444" width="1200" height="444" role="img" aria-labelledby="ttl desc">
  <title id="ttl">A theme starts with 16 colors</title>
  <desc id="desc">The 16 palette slots, base00 to base0F, shown with the example colors from docs/theme-package.md. base00 is the background, base01 the surface, base03 the border, base04 muted text, base05 text and base0D the accent.</desc>
