# Hyprwave config template - rendered from theme.toml

[general]
fps = 60
width = 1920
height = 1080

[visualizer]
enabled = true
type = "wave"
bars = 64
sensitivity = 1.0
color_scheme = "theme"

[colors]
background = "#0d0d0d"
foreground = "#ffffff"
primary = "#ff000c"
secondary = "#a29bfe"
accent = "#5fe4ff"
error = "#ff6b6b"
warning = "#ffe66d"
success = "#69db7c"

[wave]
style = "filled"
thickness = 2
gap = 1
mirror = true
round_caps = true

[particles]
enabled = false
count = 100
size = 2
speed = 0.5

[audio]
source = "auto"
fallback = "monitor"