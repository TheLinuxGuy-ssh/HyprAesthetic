# Hyprwave config template - rendered from theme.toml

[general]
fps = 60
width = 1920
height = 1080

[visualizer]
enabled = true
type = "wave"
bars = 64
sensitivity = 1.0
color_scheme = "theme"

[colors]
background = "#101a2c"
foreground = "#e8eef7"
primary = "#2563eb"
secondary = "#7c3aed"
accent = "#0f766e"
error = "#c0392b"
warning = "#b8860b"
success = "#1e8449"

[wave]
style = "filled"
thickness = 2
gap = 1
mirror = true
round_caps = true

[particles]
enabled = false
count = 100
size = 2
speed = 0.5

[audio]
source = "auto"
fallback = "monitor"